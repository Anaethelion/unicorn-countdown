<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a0a5e">
<title>Unicorn Countdown</title>
<style>
  :root {
    --pink:#ff7ad9; --purple:#9b5cff; --blue:#5cd4ff; --mint:#7dffc4; --gold:#ffe36e;
    --pad: max(env(safe-area-inset-top), 2vmin);
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    min-height: 100dvh; height: 100dvh;
    font-family: "Trebuchet MS", "Avenir Next", system-ui, sans-serif;
    color: #fff;
    background: linear-gradient(135deg, #1c0647, #5b1a9a, #d6309a, #ff9a6b, #3fb6ff, #1c0647);
    background-size: 400% 400%;
    animation: bg 20s ease infinite;
    touch-action: manipulation;
  }
  @keyframes bg { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }

  /* ---------- background layers ---------- */
  .layer { position: fixed; inset: 0; pointer-events: none; }
  #fx { z-index: 6; width: 100%; height: 100%; }
  #stars { z-index: 0; }
  .aurora { z-index: 0; mix-blend-mode: screen; opacity: .55; filter: blur(40px);
    background:
      radial-gradient(40vmax 30vmax at 15% 20%, rgba(92,212,255,.55), transparent 70%),
      radial-gradient(35vmax 28vmax at 85% 30%, rgba(255,122,217,.55), transparent 70%),
      radial-gradient(45vmax 30vmax at 50% 95%, rgba(125,255,196,.35), transparent 70%);
    animation: drift 16s ease-in-out infinite alternate; }
  @keyframes drift { to { transform: translate(3vw,-2vh) scale(1.12) rotate(2deg); } }

  /* the rainbow arch: dim bands always visible, bright "glow" copies are revealed behind the flying unicorn */
  #arc { z-index: 1; width: 100%; height: 100%; overflow: visible; }
  #arc .base { opacity: .38; animation: shimmer 7s ease-in-out infinite alternate; }
  #arc .glow { filter: drop-shadow(0 0 6px rgba(255,255,255,.75)) saturate(1.3); }
  #arc path { fill: none; stroke-linecap: round; }
  @keyframes shimmer { to { opacity: .55; } }

  .clouds { z-index: 1; inset: auto 0 0 0; height: 30dvh;
    background:
      radial-gradient(ellipse 20% 60% at 8% 100%, rgba(255,255,255,.6), transparent 70%),
      radial-gradient(ellipse 24% 80% at 33% 112%, rgba(255,255,255,.5), transparent 70%),
      radial-gradient(ellipse 22% 70% at 62% 105%, rgba(255,255,255,.6), transparent 70%),
      radial-gradient(ellipse 26% 85% at 92% 110%, rgba(255,255,255,.5), transparent 70%);
    animation: cloud 12s ease-in-out infinite alternate; }
  @keyframes cloud { to { transform: translateX(-3vw); } }

  /* ---------- layout ---------- */
  main { position: relative; z-index: 3; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: clamp(.6rem, 2.2dvh, 1.6rem); text-align: center; padding: var(--pad) 3vw max(env(safe-area-inset-bottom), 2vmin); }

  h1 { font-size: clamp(1.05rem, min(4.2vw, 5dvh), 2.8rem); letter-spacing: .14em; text-transform: uppercase; line-height: 1.2;
       text-shadow: 0 0 12px var(--pink), 0 0 32px var(--purple); }
  h1 span { display: inline-block; animation: bob 2.4s ease-in-out infinite; }
  .sub { font-size: clamp(.9rem, min(2.4vw, 3.4dvh), 1.6rem); opacity: .95; text-shadow: 0 2px 10px rgba(0,0,0,.4); min-height: 1.4em; transition: opacity .4s; }

  .clock { display: flex; align-items: center; justify-content: center; gap: clamp(.3rem, 1.4vw, 1.4rem); width: 100%; }
  .unit {
    position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: clamp(.4rem, 2dvh, 1.6rem) clamp(.5rem, 1.8vw, 2rem);
    min-width: clamp(4.6rem, 20vw, 21rem);
    border-radius: clamp(14px, 2.5vw, 34px);
    background: linear-gradient(160deg, rgba(255,255,255,.22), rgba(255,255,255,.05));
    backdrop-filter: blur(10px) saturate(160%); -webkit-backdrop-filter: blur(10px) saturate(160%);
    box-shadow: 0 10px 40px rgba(40,0,90,.45), inset 0 0 0 1px rgba(255,255,255,.25);
    isolation: isolate;
  }
  /* animated rainbow border */
  .unit::before {
    content: ""; position: absolute; inset: -3px; border-radius: inherit; z-index: -1;
    background: conic-gradient(from var(--a, 0deg), #ff4d4d, #ffe34d, #5dff7a, #4dc3ff, #c58cff, #ff4dd8, #ff4d4d);
    animation: spin 6s linear infinite; filter: blur(1px);
  }
  .unit::after { content: ""; position: absolute; inset: 0; border-radius: inherit; z-index: -1;
    background: linear-gradient(160deg, rgba(60,10,120,.88), rgba(110,30,150,.8)); }
  @property --a { syntax: "<angle>"; inherits: false; initial-value: 0deg; }
  @keyframes spin { to { --a: 360deg; } }

  .num {
    font-size: clamp(3rem, min(15vw, 28dvh), 15rem); font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums;
    background: linear-gradient(90deg, #ff6ad5, #ffe36e, #7dffc4, #5cd4ff, #c58cff, #ff6ad5);
    background-size: 300% 100%; -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: flow 5s linear infinite;
    filter: drop-shadow(0 0 16px rgba(255,255,255,.55));
  }
  .num.tick { animation: flow 5s linear infinite, pop .35s ease; }
  @keyframes flow { to { background-position: 300% 0; } }
  @keyframes pop { 40% { transform: scale(1.14) rotate(-2deg); } }
  .label { font-size: clamp(.6rem, min(1.8vw, 2.6dvh), 1.4rem); letter-spacing: .28em; text-transform: uppercase; margin-top: .3em; padding-left: .28em; opacity: .9; }
  .colon { font-size: clamp(2rem, min(9vw, 16dvh), 9rem); font-weight: 900; opacity: .85; animation: blink 1s steps(2) infinite; text-shadow: 0 0 20px var(--pink); }
  @keyframes blink { 50% { opacity: .15; } }

  /* last minute: seconds go wild */
  body.final .unit:last-child { animation: heartbeat 1s ease-in-out infinite; }
  @keyframes heartbeat { 10% { transform: scale(1.08); } 30% { transform: scale(1); } 45% { transform: scale(1.05); } }

  /* week progress with a unicorn riding along */
  .track { position: relative; width: min(900px, 86vw); height: clamp(10px, 1.8dvh, 16px); border-radius: 99px; background: rgba(255,255,255,.2); box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); margin-top: clamp(.4rem, 2dvh, 1.2rem); }
  .fill { height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, #ff4d4d, #ffa94d, #ffe34d, #5dff7a, #4dc3ff, #c58cff, #ff4dd8); box-shadow: 0 0 18px rgba(255,255,255,.6); transition: width 1s linear; }
  .rider { position: absolute; top: 50%; left: 0; font-size: clamp(1.6rem, 5vw, 3rem); transform: translate(-50%, -62%) scaleX(-1); transition: left 1s linear; filter: drop-shadow(0 0 10px #fff); }
  .pct { font-size: clamp(.75rem, 1.6vw, 1.1rem); opacity: .85; }
  .target { font-size: clamp(.8rem, min(1.8vw, 2.6dvh), 1.3rem); opacity: .85; }

  /* ---------- unicorns ---------- */
  .unicorn { position: fixed; z-index: 4; user-select: none; -webkit-user-select: none; cursor: pointer; filter: drop-shadow(0 0 14px rgba(255,255,255,.85)); }
  .u1 { left: 2vw;  bottom: 3dvh; font-size: clamp(3rem, min(14vw, 24dvh), 12rem); animation: bob 3s ease-in-out infinite; }
  .u2 { right: 2vw; bottom: 5dvh; font-size: clamp(2.6rem, min(12vw, 20dvh), 10rem); animation: bob2 3.6s ease-in-out infinite; }
  @keyframes bob  { 50% { transform: translateY(-2.5dvh) rotate(-4deg); } }
  @keyframes bob2 { 0%,100%{ transform: scaleX(-1) translateY(0) rotate(3deg);} 50%{ transform: scaleX(-1) translateY(-3dvh) rotate(-3deg);} }
  .u2 { transform: scaleX(-1); }

  .flyer { position: fixed; z-index: 4; left: 0; top: 0; pointer-events: none; will-change: transform; }
  .flyer .u { display: block; font-size: clamp(2.2rem, 6.5vw, 5.5rem); line-height: 1; filter: drop-shadow(0 0 12px #fff); transform: scaleX(-1); }

  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .unicorn:focus-visible { outline: 3px solid #fff; outline-offset: 4px; border-radius: 50%; }
  .party { font-size: clamp(2rem, 9vw, 9rem); font-weight: 900; line-height: 1.05; text-shadow: 0 0 30px var(--gold), 0 0 60px var(--pink); animation: bob 1s ease-in-out infinite; padding: 0 2vw; }

  /* ---------- responsive ---------- */
  /* Phones in portrait: 2x2 grid, no colons, unicorns tuck to the corners */
  @media (max-width: 640px) {
    .clock { display: grid; grid-template-columns: repeat(2, 1fr); gap: 3vw; max-width: 460px; padding: 0 2vw; }
    .colon { display: none; }
    .unit { min-width: 0; padding: 2dvh 2vw; }
    .num { font-size: clamp(3rem, min(26vw, 15dvh), 9rem); }
    .label { letter-spacing: .2em; }
    .u1 { font-size: clamp(2.5rem, 17vw, 5rem); left: 0; bottom: 1dvh; }
    .u2 { font-size: clamp(2.2rem, 15vw, 4.5rem); right: 0; bottom: 2dvh; }
    h1 { letter-spacing: .08em; }
  }
  /* Landscape phones / very short screens: single row, compact */
  @media (max-height: 480px) and (orientation: landscape) {
    main { gap: .35rem; }
    .clock { display: flex; }
    .colon { display: block; font-size: clamp(1.5rem, 8dvh, 4rem); }
    .num { font-size: clamp(2.4rem, min(11vw, 34dvh), 8rem); }
    .unit { padding: .3rem .8rem; min-width: 0; }
    .sub, .target, .pct, .track { display: none; }
    .u1, .u2 { font-size: clamp(2rem, 20dvh, 4rem); }
  }
  /* Big TVs / wall displays */
  @media (min-width: 1800px) { .num { font-size: min(14vw, 30dvh); } }

  @media (prefers-reduced-motion: reduce) { * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition: none !important; } }
</style>
</head>
<body>
<div class="layer aurora"></div>
<canvas class="layer" id="stars"></canvas>
<svg class="layer" id="arc" aria-hidden="true"><g class="base" id="arcBase"></g><g class="glow" id="arcGlow"></g></svg>
<div class="layer clouds"></div>
<canvas class="layer" id="fx"></canvas>

<div class="unicorn u1" title="Boop!" role="button" tabindex="0" aria-label="Unicorn: boop for sparkles">🦄</div>
<div class="unicorn u2" title="Boop!" role="button" tabindex="0" aria-label="Unicorn: boop for sparkles">🦄</div>
<div class="flyer" id="flyer"><div class="u">🦄</div></div>

<main>
  <h1><span>✨</span> Countdown to Monday <span style="animation-delay:.4s">✨</span></h1>
  <p class="sub" id="msg">🌈 until 5:30 PM — unicorn o'clock 🌈</p>

  <p class="sr" id="sr" role="timer" aria-live="off"></p>
  <div class="clock" id="clock" aria-hidden="true">
    <div class="unit"><div class="num" id="d">00</div><div class="label">days</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="num" id="h">00</div><div class="label">hours</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="num" id="m">00</div><div class="label">minutes</div></div>
    <div class="colon">:</div>
    <div class="unit"><div class="num" id="s">00</div><div class="label">seconds</div></div>
  </div>

  <div class="track" aria-hidden="true"><div class="fill" id="fill"></div><div class="rider" id="rider">🦄</div></div>
  <p class="pct" id="pct"></p>
  <p class="target" id="target"></p>
</main>

<script>
// Next Monday at 17:30 local time (today, if it's Monday before 17:30).
function nextTarget(now = new Date()) {
  const t = new Date(now);
  t.setHours(17, 30, 0, 0);
  t.setDate(t.getDate() + (1 - now.getDay() + 7) % 7);
  if (t <= now) t.setDate(t.getDate() + 7);
  return t;
}
let target = nextTarget();
let start = new Date(target); start.setDate(start.getDate() - 5); start.setHours(14, 0, 0, 0);   // the Wednesday 2:00 PM before the target
document.getElementById('target').textContent =
  target.toLocaleString(undefined, { weekday: 'long', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });

const $ = id => document.getElementById(id);
const els = { d: $('d'), h: $('h'), m: $('m'), s: $('s') };
const pad = n => String(n).padStart(2, '0');
let celebrating = false;

const messages = [
  "🌈 until 5:30 PM — unicorn o'clock 🌈", "✨ Hold on, the glitter is loading… ✨",
  "🦄 Keep calm and sparkle on 🦄", "🍭 Almost time for magic 🍭", "💖 You've got this — unicorns believe in you 💖",
  "🌟 Every second is a little bit more magical 🌟"
];
let mi = 0;
setInterval(() => {
  if (celebrating) return;
  const el = $('msg'); el.style.opacity = 0;
  setTimeout(() => { mi = (mi + 1) % messages.length; el.textContent = messages[mi]; el.style.opacity = 1; }, 400);
}, 5000);

function tick() {
  const now = new Date(), diff = target - now;
  if (diff <= 0) {
    if (!celebrating) {
      celebrating = true;
      document.body.classList.remove('final');
      $('clock').innerHTML = '<div class="party">🦄 IT\'S UNICORN TIME! 🦄</div>';
      $('msg').textContent = '🎉 Go! Be free! 🎉';
      $('fill').style.width = '100%'; $('rider').style.left = '100%';
      for (let i = 0; i < 40; i++) setTimeout(() => burst(Math.random()*innerWidth, Math.random()*innerHeight*.8, 60), i*200);
      setTimeout(() => location.reload(), 60000);
    }
    return;
  }
  const sec = Math.floor(diff / 1000);
  const vals = { d: Math.floor(sec/86400), h: Math.floor(sec/3600)%24, m: Math.floor(sec/60)%60, s: sec%60 };
  for (const k in vals) {
    const v = pad(vals[k]);
    if (els[k].textContent !== v) {
      els[k].textContent = v;
      els[k].classList.remove('tick'); void els[k].offsetWidth; els[k].classList.add('tick');
      if (k === 's' && sec < 60) burst(innerWidth/2, innerHeight/2, 14);
    }
  }
  document.body.classList.toggle('final', sec < 60);
  const p = Math.min(1, Math.max(0, (now - start) / (target - start)));
  $('fill').style.width = $('rider').style.left = (p * 100) + '%';
  $('pct').textContent = `${(p * 100).toFixed(2)}% of the week survived`;
  $('sr').textContent = `${vals.d} days, ${vals.h} hours, ${vals.m} minutes until Monday 5:30 PM`;
  document.title = `${pad(vals.d)}d ${pad(vals.h)}:${pad(vals.m)}:${pad(vals.s)} 🦄`;
}
tick(); setInterval(tick, 250);

// ---------- canvases ----------
const fx = $('fx'), ctx = fx.getContext('2d');
const sk = $('stars'), sctx = sk.getContext('2d');
let W, H, dpr, bgStars = [];
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  for (const c of [fx, sk]) { c.width = W * dpr; c.height = H * dpr; }
  const n = Math.round(W * H / 6000);
  bgStars = Array.from({ length: n }, () => ({
    x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .3,
    tw: Math.random() * 6.28, sp: Math.random() * .03 + .01, z: Math.random() * .8 + .2
  }));
}
addEventListener('resize', resize); resize();

const colors = ['#fff', '#ffe36e', '#ff7ad9', '#7dffc4', '#5cd4ff', '#c58cff'];
const parts = [], shooters = [];

function star(c, x, y, r, rot) {
  c.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = rot + i * Math.PI / 4, rad = i % 2 ? r * .25 : r;
    c.lineTo(x + Math.cos(a) * rad, y + Math.sin(a) * rad);
  }
  c.closePath(); c.fill();
}
function spawn(x, y, o = {}) {
  if (parts.length > 500 || document.hidden) return;
  parts.push({
    x, y, vx: (Math.random()-.5) * (o.spread||1), vy: (Math.random()-.5) * (o.spread||1) + (o.rise||0),
    r: (Math.random()*9 + 4) * (o.size||1), life: 0, max: o.max || (60 + Math.random()*60),
    rot: Math.random()*6, vr: (Math.random()-.5)*.1, c: colors[Math.random()*colors.length|0], g: .04
  });
}
function burst(x, y, n = 30) {
  if (document.hidden) return;
  for (let i = 0; i < n; i++) {
    const a = Math.random()*Math.PI*2, sp = Math.random()*7 + 2;
    parts.push({ x, y, vx: Math.cos(a)*sp, vy: Math.sin(a)*sp, r: Math.random()*12+5, life: 0, max: 50+Math.random()*50,
      rot: Math.random()*6, vr: (Math.random()-.5)*.2, c: colors[Math.random()*colors.length|0], g: .08 });
  }
}
setInterval(() => { for (let i = 0; i < 3; i++) spawn(Math.random()*W, Math.random()*H, { spread: .3, max: 90, size: .8 }); }, 140);
setInterval(() => {                       // shooting star
  const x = Math.random() * W * .8, y = Math.random() * H * .4;
  shooters.push({ x, y, vx: 9 + Math.random()*6, vy: 4 + Math.random()*3, life: 0, max: 45 });
}, 2800);

// pointer interaction + parallax
let px = 0, py = 0;
let lx = 0, ly = 0;
addEventListener('pointermove', e => {
  if (Math.hypot(e.clientX - lx, e.clientY - ly) < 10) return;   // thin out the trail
  lx = e.clientX; ly = e.clientY;
  spawn(e.clientX, e.clientY, { spread: 2.5, rise: .6, max: 45 });
  px = (e.clientX / W - .5); py = (e.clientY / H - .5);
});
addEventListener('deviceorientation', e => {            // tilt parallax on phones
  if (e.gamma == null) return;
  px = Math.max(-.5, Math.min(.5, e.gamma / 60)); py = Math.max(-.5, Math.min(.5, (e.beta - 45) / 90));
});
addEventListener('pointerdown', e => burst(e.clientX, e.clientY, 36));
const boop = u => { const r = u.getBoundingClientRect(); burst(r.left + r.width/2, r.top + r.height/2, 80); };
document.querySelectorAll('.unicorn').forEach(u => {
  u.addEventListener('pointerdown', e => { e.stopPropagation(); boop(u); });
  u.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); boop(u); } });
});

// ---------- rainbow arch + unicorn that lights it up as it flies ----------
const SVGNS = 'http://www.w3.org/2000/svg';
const bandColors = ['#ff4d4d', '#ffa94d', '#ffe34d', '#5dff7a', '#4dc3ff', '#7a4dff', '#ff4dd8'];
const TAILS = [300, 180, 80];            // trail lengths in 1/1000ths of the arch, each brighter than the last
const TAIL_OPACITY = [.35, .5, .9];
let glowPaths = [], midPath = null, midLen = 1;

function buildArc() {
  const base = $('arcBase'), glow = $('arcGlow');
  base.textContent = glow.textContent = '';
  glowPaths = [];
  const cx = W / 2, cy = H * .32, rx = W * .58, ry = Math.min(H * .24, W * .5);
  const bw = Math.max(5, Math.min(W, H) * .016);
  const mk = (parent, i, extra) => {
    const p = document.createElementNS(SVGNS, 'path');
    const a = rx - i * bw, b = ry - i * bw;
    p.setAttribute('d', `M ${cx - a} ${cy} A ${a} ${b} 0 0 1 ${cx + a} ${cy}`);
    p.setAttribute('pathLength', 1000);
    p.setAttribute('stroke', bandColors[i]);
    p.setAttribute('stroke-width', bw + .6);
    if (extra) extra(p);
    parent.appendChild(p);
    return p;
  };
  bandColors.forEach((_, i) => {
    mk(base, i);
    TAILS.forEach((len, k) => {
      const p = mk(glow, i, p => p.setAttribute('opacity', TAIL_OPACITY[k]));
      p.dataset.len = len; glowPaths.push(p);
    });
  });
  midPath = base.children[3]; midLen = midPath.getTotalLength();
}
buildArc();
addEventListener('resize', buildArc);

const FLY_SECONDS = 14;
function fly(t) {
  const head = (((t / 1000) / FLY_SECONDS) % 1) * 1300 - 150;      // runs a little past both ends so it leaves and re-enters
  for (const p of glowPaths) {
    const len = +p.dataset.len;
    p.setAttribute('stroke-dasharray', `${len} 3000`);
    p.setAttribute('stroke-dashoffset', -(head - len));
  }
  const u = Math.min(1000, Math.max(0, head)) / 1000;
  const pt = midPath.getPointAtLength(u * midLen), ahead = midPath.getPointAtLength(Math.min(midLen, u * midLen + 2));
  const ang = Math.atan2(ahead.y - pt.y, ahead.x - pt.x) * 180 / Math.PI;
  const w = flyer.offsetWidth, h = flyer.offsetHeight;
  flyer.style.transform = `translate(${pt.x - w/2}px, ${pt.y - h * .62}px) rotate(${ang * .6}deg)`;
  if (head > 0 && head < 1000 && ++ft % 3 === 0) spawn(pt.x, pt.y, { spread: 1.2, max: 40, size: .7 });
}
const flyer = $('flyer'); let ft = 0;

let t0 = 0;
(function loop(t) {
  t0 = t * .001;
  // background starfield (parallax + twinkle)
  sctx.clearRect(0, 0, sk.width, sk.height);
  for (const s of bgStars) {
    const a = .35 + .65 * Math.abs(Math.sin(t0 * s.sp * 40 + s.tw));
    const x = (s.x + px * 40 * s.z + W) % W, y = (s.y + py * 40 * s.z + H) % H;
    sctx.globalAlpha = a; sctx.fillStyle = '#fff';
    sctx.beginPath(); sctx.arc(x * dpr, y * dpr, s.r * dpr, 0, 6.283); sctx.fill();
  }
  sctx.globalAlpha = 1;

  // sparkles + bursts
  ctx.clearRect(0, 0, fx.width, fx.height);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life++;
    if (p.life > p.max) { parts.splice(i, 1); continue; }
    p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= .985; p.rot += p.vr;
    const s = Math.sin(p.life / p.max * Math.PI);
    ctx.globalAlpha = s; ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 12 * dpr;
    star(ctx, p.x*dpr, p.y*dpr, p.r*s*dpr, p.rot);
  }
  ctx.shadowBlur = 0;
  // shooting stars
  for (let i = shooters.length - 1; i >= 0; i--) {
    const s = shooters[i]; s.life++; s.x += s.vx; s.y += s.vy;
    if (s.life > s.max) { shooters.splice(i, 1); continue; }
    const g = ctx.createLinearGradient(s.x*dpr, s.y*dpr, (s.x - s.vx*8)*dpr, (s.y - s.vy*8)*dpr);
    g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.globalAlpha = 1 - s.life / s.max; ctx.strokeStyle = g; ctx.lineWidth = 2.5 * dpr;
    ctx.beginPath(); ctx.moveTo(s.x*dpr, s.y*dpr); ctx.lineTo((s.x - s.vx*8)*dpr, (s.y - s.vy*8)*dpr); ctx.stroke();
  }
  ctx.globalAlpha = 1;
  fly(t);
  requestAnimationFrame(loop);
})(0);
</script>
